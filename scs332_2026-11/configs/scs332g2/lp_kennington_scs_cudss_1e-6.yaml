run:
  name: lp_kennington_scs_cudss_1e-6
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 360.0
  datasets:
  - name: kennington
    id: kennington
    include:
    - cre-a
    - cre-b
    - cre-c
    - cre-d
    - ken-07
    - ken-11
    - ken-13
    - ken-18
    - osa-07
    - osa-14
    - osa-30
    - osa-60
    - pds-02
    - pds-06
    - pds-10
    - pds-20
solvers:
- id: scs_cudss_1e-6
  solver: scs
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    time_limit_secs: 300.0
    linear_solver: cudss
