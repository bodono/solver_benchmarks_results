run:
  datasets:
  - id: sdplib
    include:
    - gpp124-2
    - gpp250-3
    - gpp250-4
    - hinf6
    - hinf7
    - mcp124-3
    - mcp250-4
    - mcp500-2
    - theta2
    - truss1
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-4_c1_p3
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
