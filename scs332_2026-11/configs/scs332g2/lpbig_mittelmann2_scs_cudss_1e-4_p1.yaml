run:
  datasets:
  - id: mittelmann2
    include:
    - L1_sixm1000obs
    - L1_sixm250obs
    - Linf_520c
    - s82
    - savsched1
    - set-cover-model
    - square41
    name: mittelmann
  name: lpbig_mittelmann2_scs_cudss_1e-4_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 1800.0
  solver: scs
