run:
  datasets:
  - id: sdplib
    include:
    - control9
    - gpp100
    - hinf12
    - hinf3
    - hinf9
    - maxG11
    - mcp100
    - thetaG11
    - truss8
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-4_c1_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
