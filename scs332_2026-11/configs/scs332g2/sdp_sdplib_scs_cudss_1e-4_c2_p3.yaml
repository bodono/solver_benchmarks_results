run:
  datasets:
  - id: sdplib
    include:
    - arch0
    - gpp124-1
    - gpp250-1
    - hinf10
    - hinf11
    - hinf15
    - hinf2
    - hinf8
    - mcp500-3
    - qap5
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-4_c2_p3
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
