run:
  datasets:
  - id: sdplib
    include:
    - control4
    - hinf13
    - mcp124-1
    - mcp250-1
    - qap7
    - qpG51
    - theta4
    - thetaG51
    - truss2
    - truss6
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-4_c2_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
