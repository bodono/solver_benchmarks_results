run:
  datasets:
  - id: sdplib
    include:
    - control2
    - gpp124-3
    - maxG60
    - truss5
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-4_c1_p0
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
