run:
  datasets:
  - id: sdplib
    include:
    - arch2
    - hinf15
    - qap7
    - truss6
    name: sdplib
  name: sdp_sdplib_scs_cudss_1e-6_c2_p2
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cudss_1e-6
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    linear_solver: cudss
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
