run:
  datasets:
  - id: sdplib
    include:
    - equalG51
    - gpp124-1
    - hinf15
    - hinf5
    - maxG11
    - mcp250-3
    - mcp500-1
    - qap7
    - theta3
    - truss2
    - truss4
    name: sdplib
  name: sdp_sdplib_scs_cpu_1e-6_c2_p0
