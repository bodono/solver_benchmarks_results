run:
  datasets:
  - id: sdplib
    include:
    - control4
    - control6
    - gpp500-1
    - hinf5
    - hinf7
    - maxG11
    - mcp250-3
    - qap7
    - ss30
    - theta3
    - theta4
    name: sdplib
  name: sdp_sdplib_scs_cpu_1e-4_c1_p2
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cpu_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
