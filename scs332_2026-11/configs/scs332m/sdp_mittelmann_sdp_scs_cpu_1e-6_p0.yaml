run:
  datasets:
  - dataset_options:
      subset: all
    id: mittelmann_sdp
    include:
    - G40mc
    - cnhil8
    name: mittelmann_sdp
  name: sdp_mittelmann_sdp_scs_cpu_1e-6_p0
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cpu_1e-6
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
