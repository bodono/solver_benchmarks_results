run:
  datasets:
  - id: sdplib
    include:
    - arch2
    - control7
    - gpp500-4
    - hinf11
    - hinf15
    - hinf8
    - mcp250-1
    - mcp500-2
    - truss1
    - truss8
    name: sdplib
  name: sdp_sdplib_scs_cpu_1e-4_c2_p2
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cpu_1e-4
  settings:
    eps_abs: 0.0001
    eps_rel: 0.0001
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
