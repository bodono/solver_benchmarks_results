run:
  datasets:
  - id: sdplib
    include:
    - gpp124-3
    - gpp250-3
    - hinf1
    - hinf6
    - maxG32
    - mcp100
    - mcp124-1
    - qap8
    - theta1
    - truss1
    name: sdplib
  name: sdp_sdplib_scs_cpu_1e-6_c2_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cpu_1e-6
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
