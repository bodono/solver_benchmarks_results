run:
  datasets:
  - id: mittelmann2
    include:
    - L1_sixm250obs
    - brazil3
    - set-cover-model
    - woodlands09
    name: mittelmann
  name: lpbig_mittelmann2_scs_cpu_1e-5_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
solvers:
- id: scs_cpu_1e-5
  settings:
    eps_abs: 1.0e-05
    eps_rel: 1.0e-05
    max_iters: 1000000
    time_limit_secs: 1800.0
  solver: scs
