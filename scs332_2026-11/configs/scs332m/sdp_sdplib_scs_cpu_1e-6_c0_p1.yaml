run:
  datasets:
  - id: sdplib
    include:
    - equalG11
    - hinf10
    - hinf9
    - mcp124-4
    - mcp500-4
    - ss30
    - theta5
    - truss5
    - truss7
    name: sdplib
  name: sdp_sdplib_scs_cpu_1e-6_c0_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 960.0
solvers:
- id: scs_cpu_1e-6
  settings:
    eps_abs: 1.0e-06
    eps_rel: 1.0e-06
    max_iters: 1000000
    time_limit_secs: 900.0
  solver: scs
