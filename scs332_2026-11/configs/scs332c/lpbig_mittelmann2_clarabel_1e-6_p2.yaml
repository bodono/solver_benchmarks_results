run:
  datasets:
  - id: mittelmann2
    include:
    - L1_sixm1000obs
    - set-cover-model
    name: mittelmann
  name: lpbig_mittelmann2_clarabel_1e-6_p2
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
solvers:
- id: clarabel_1e-6
  settings:
    time_limit: 1800.0
    tol_feas: 1.0e-06
    tol_gap_abs: 1.0e-06
    tol_gap_rel: 1.0e-06
  solver: clarabel
