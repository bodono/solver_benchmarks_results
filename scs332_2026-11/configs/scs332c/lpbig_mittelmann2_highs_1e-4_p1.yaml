run:
  datasets:
  - id: mittelmann2
    include:
    - rmine15
    - set-cover-model
    - square41
    name: mittelmann
  name: lpbig_mittelmann2_highs_1e-4_p1
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
solvers:
- id: highs_1e-4
  settings:
    dual_feasibility_tolerance: 0.0001
    primal_feasibility_tolerance: 0.0001
    time_limit: 1800.0
  solver: highs
