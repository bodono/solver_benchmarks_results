run:
  datasets:
  - id: mittelmann2
    include:
    - set-cover-model
    name: mittelmann
  name: lpbig_mittelmann2_clarabel_1e-4_p2_fill
  output_dir: results
  parallelism: 1
  resume: true
  timeout_seconds: 1860.0
solvers:
- id: clarabel_1e-4
  settings:
    time_limit: 1800.0
    tol_feas: 0.0001
    tol_gap_abs: 0.0001
    tol_gap_rel: 0.0001
  solver: clarabel
